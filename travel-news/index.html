nd Nakadomari Intersection. The changeover time may be adjusted due to weather or other conditions.", "th": "In its November 13 announcement, the Okinawa General Bureau said partial four-lane operation is planned to begin at 10:00 JST on November 21, 2026, within the approximately 2.7-kilometre section of National Route 58’s Onna Minami Bypass between Tancha and Nakadomari Intersection. The changeover time may be adjusted due to weather or other conditions."}, "urls": {"zh-hans": "https://nice.okinawa/zh-hans/news/onna-minami-bypass-partial-four-lanes-20261121/", "zh-hant": "https://nice.okinawa/zh-hant/news/onna-minami-bypass-partial-four-lanes-20261121/", "ja": "https://nice.okinawa/ja/news/onna-minami-bypass-partial-four-lanes-20261121/", "en": "https://nice.okinawa/en/news/onna-minami-bypass-partial-four-lanes-20261121/", "ko": "https://nice.okinawa/en/news/onna-minami-bypass-partial-four-lanes-20261121/", "th": "https://nice.okinawa/en/news/onna-minami-bypass-partial-four-lanes-20261121/"}}, {"id": "BR-2026-043", "date": "2026-11-23", "title": {"zh-hans": "那霸马拉松周末去机场？12月5日、6日请查单轨临时时刻表", "zh-hant": "那霸馬拉松週末去機場？12月5日、6日請查單軌電車臨時時刻表", "ja": "NAHAマラソンの週末に空港へ向かう方へ 12月5日・6日はゆいレールが臨時ダイヤに", "en": "Heading to Naha Airport on marathon weekend? Check the December 5–6 monorail timetable", "ko": "Heading to Naha Airport on marathon weekend? Check the December 5–6 monorail timetable", "th": "Heading to Naha Airport on marathon weekend? Check the December 5–6 monorail timetable"}, "description": {"zh-hans": "冲绳都市单轨电车（Yui Rail）11月10日宣布，配合第40届那霸马拉松，12月5日和6日将按临时时刻表运行。运营方预计，6日从首班车到上午9点左右，参赛者乘车会使列车较为拥挤。这是客流提醒，不是停运通知。", "zh-hant": "沖繩都市單軌電車（Yui Rail）11月10日宣布，配合第40屆那霸馬拉松，12月5日和6日將按臨時時刻表行駛。營運方預計，6日從首班車到上午9點左右，參賽者搭車會使列車較為擁擠。這是人潮提醒，不是停駛通知。", "ja": "沖縄都市モノレールは11月10日、第40回NAHAマラソンに伴い、12月5日と6日に臨時ダイヤで運行すると発表しました。大会当日の6日はランナーの利用により、始発から午前9時ごろまで混雑が予想されています。運休のお知らせではありません。", "en": "Okinawa’s Yui Rail announced on November 10 that trains will run on special timetables on December 5 and 6 for the (()=>{
  'use strict';
  const data=JSON.parse(document.getElementById('news-data').textContent);
  const select=document.getElementById('language');
  const copy={
    en:{heading:'Travel updates',read:'Read more',label:'News language',options:['Chinese (Simplified)','Japanese','English'],notes:{en:'English article',ja:'Japanese article','zh-hans':'Original article in Simplified Chinese'}},
    ja:{heading:'旅行のお知らせ',read:'続きを読む',label:'記事の言語',options:['中国語（簡体字）','日本語','英語'],notes:{en:'英語の記事',ja:'日本語の記事','zh-hans':'中国語（簡体字）の原文'}},
    'zh-hans':{heading:'旅行资讯',read:'阅读全文',label:'新闻语言',options:['简体中文','日文','英文'],notes:{en:'英文文章',ja:'日文文章','zh-hans':'简体中文原文'}}
  };
  const params=new URLSearchParams(location.search);
  const normalize=value=>{value=String(value||'').toLowerCase();return /^ja(?:-|$)/.test(value)?'ja':/^(zh|zh-cn|zh-sg|zh-hans)(?:$|-)/.test(value)&&!/^zh-(tw|hk|mo|hant)/.test(value)?'zh-hans':'en'};
  let manual=params.get('manual')==='1';
  select.value=normalize(params.get('lang')||(navigator.languages||[])[0]||navigator.language||'en');
  function render(){
    const lang=select.value,ui=copy[lang];
    document.documentElement.lang=lang;
    document.title=ui.heading;
    document.getElementById('heading').textContent=ui.heading;
    select.setAttribute('aria-label',ui.label);
    Array.from(select.options).forEach((option,index)=>{option.textContent=ui.options[index]});
    const cards=document.getElementById('cards');cards.replaceChildren();
    for(const item of data.articles){
      const available=code=>item.title[code]&&item.description[code]&&item.urls[code];
      const actual=[lang,'en','zh-hans','ja'].find(available);
      if(!actual)continue;
      const article=document.createElement('article');article.dataset.articleId=item.id;
      const date=document.createElement('small');date.textContent=item.date;
      const h=document.createElement('h3');h.textContent=item.title[actual];h.lang=actual;
      const p=document.createElement('p');p.textContent=item.description[actual];p.lang=actual;
      const a=document.createElement('a');a.href=item.urls[actual];a.target='_blank';a.rel='noopener noreferrer';a.textContent=ui.read+' →';
      const note=document.createElement('small');note.textContent=ui.notes[actual];
      article.append(date,h,p,a,document.createElement('br'),note);cards.append(article);
    }
  }
  select.addEventListener('change',()=>{manual=true;render();parent.postMessage({type:'nice-travel-manual',lang:select.value},'*')});
  addEventListener('message',event=>{
    if(event.source!==parent||event.data?.type!=='nice-travel-language'||!Object.hasOwn(copy,event.data.lang))return;
    if(manual&&!event.data.manual)return;
    select.value=event.data.lang;manual=manual||!!event.data.manual;render();
  });
  render();parent.postMessage({type:'nice-travel-ready'},'*');
})();

</script></body></html>
